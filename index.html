<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atelier Delerue — Galerie virtuelle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">

<!-- =====================================================================
     RÉGLAGES (c'est le seul endroit à modifier)
     ===================================================================== -->
<script>
window.GALLERY_CONFIG = {
  modelUrl: 'gallery.glb',
  binId: '6ac6a8dbffd5d16053572822',          // bin jsonbin (positions des tableaux)
  contactEmail: 'zonedel81@gmail.com',
  // EmailJS : à remplir avec les 3 valeurs de ton compte emailjs.com (elles sont faites pour être publiques)
  emailjs: { service: 'VOTRE_SERVICE_ID', template: 'VOTRE_TEMPLATE_ID', publicKey: 'VOTRE_CLE_PUBLIQUE' },
  rotationStepDeg: 5,     // pas de rotation des tableaux (admin : J / L)
  eyeHeight: 1.25,        // hauteur des yeux
  exposure: 1.0,          // luminosité globale (monte à 1.2 si c'est trop sombre)
  toneMapping: 'linear',  // 'linear' = couleurs fidèles des tableaux | 'aces' = rendu plus cinéma
  darken: 0.55,           // assombrissement des matériaux du modèle
  bloom: 0.55,             // intensité du halo lumineux (0 = désactivé) — PC uniquement
  // --- Éclairage (modifiable) ---
  ambient: 1.0,           // lumière de fond de la salle (monte à 1.4 si c'est trop sombre)
  wallGlow: 0.4,          // lueur propre aux structures blanches du modèle (1 = comme avant, 0 = aucune)
  sunColor: 0xff9a52,     // couleur du soleil couchant
  sunIntensity: 9,        // force du soleil qui entre par la verrière
  sunElevation: 24,       // hauteur du soleil en degrés (petit = soleil rasant)
  sunAzimuth: 270,        // direction du soleil en degrés (0, 90, 180, 270 : change si les rayons tombent mal)
  skyShafts: 0.14,        // rayons visibles dans l'air sous la verrière (0 = désactivé)
  shadows: true,          // ombres portées du soleil (calculées une seule fois, sans coût ensuite)
  lampIntensity: 5,       // force des lampes au-dessus des tableaux
  lampColor: 0xffd9a8     // couleur de la lumière des lampes
};

/* Démarre les téléchargements TOUT DE SUITE (en parallèle du chargement de three.js) */
(function () {
  var C = window.GALLERY_CONFIG, E = window.__early = {};
  E.glb = fetch(C.modelUrl).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r; });
  E.glb.catch(function () {});
  E.remote = fetch('https://api.jsonbin.io/v3/b/' + C.binId + '/latest')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { return (d && d.record && d.record.paintings) || []; })
    .catch(function () { return null; });
})();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<style>
  :root {
    --c1: #00e5ff; --c2: #8a5cff; --c3: #ff3df2; --bg: #04060c;
    --glass: rgba(10, 14, 26, .55); --line: rgba(255, 255, 255, .14);
    --k: clamp(54px, 17vmin, 76px); --pad: max(16px, env(safe-area-inset-left)); --display: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
    --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: var(--bg); overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; font-family: var(--body); color: #fff; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; touch-action: none; }

  /* ---------- Écran d'accueil / pause ---------- */
  #intro {
    position: fixed; inset: 0; height: 100dvh; z-index: 1010; display: flex; align-items: center; justify-content: center;
    background: var(--bg); overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); transition: background .9s ease, opacity .7s ease, visibility .7s;
  }
  #intro.ready { background: radial-gradient(ellipse at center, rgba(4,6,12,.35) 0%, rgba(4,6,12,.82) 100%); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  #intro.out { opacity: 0; visibility: hidden; pointer-events: none; }
  .grid { pointer-events: none; position: absolute; left: -50%; right: -50%; bottom: -8%; height: 70%;
    background-image: linear-gradient(rgba(0,229,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.35) 1px, transparent 1px);
    background-size: 64px 64px; transform: perspective(520px) rotateX(62deg); animation: gridmove 3s linear infinite;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%); mask-image: linear-gradient(to top, #000 10%, transparent 85%); opacity: .55; transition: opacity .9s; }
  #intro.ready .grid { opacity: .18; }
  @keyframes gridmove { to { background-position: 0 64px; } }
  .aurora { pointer-events: none; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 14s ease-in-out infinite alternate; }
  .aurora.a1 { background: var(--c2); left: -15vmax; top: -20vmax; }
  .aurora.a2 { background: var(--c3); right: -20vmax; bottom: -25vmax; animation-delay: -6s; opacity: .30; }
  .aurora.a3 { background: var(--c1); right: 10vmax; top: -30vmax; opacity: .22; animation-delay: -3s; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  .card { position: relative; text-align: center; padding: 28px; max-width: 640px; width: 100%; margin: auto; }
  .eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .5em; color: var(--c1); text-shadow: 0 0 14px rgba(0,229,255,.8); margin-bottom: 18px; }
  .title { font-family: var(--display); font-weight: 900; margin: 0; line-height: 1.05; font-size: clamp(30px, 7.2vw, 66px); letter-spacing: .06em;
    background: linear-gradient(100deg, #fff 0%, var(--c1) 35%, var(--c2) 65%, var(--c3) 100%); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; filter: drop-shadow(0 0 22px rgba(138,92,255,.55)); }
  @keyframes shine { to { background-position: 200% center; } }
  .sub { margin: 14px 0 34px; font-size: 18px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.7); font-weight: 500; }
  .loadbox { width: min(360px, 82%); margin: 0 auto 26px; transition: opacity .5s, height .5s, margin .5s; }
  .loadbox.done { opacity: 0; height: 0; margin: 0 auto; overflow: hidden; }
  .track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; position: relative; }
  #barfill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 16px var(--c1); transition: width .25s ease-out; }
  .loadtxt { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  #enter { position: relative; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .38em; color: #fff; cursor: pointer;
    padding: 18px 46px 18px 52px; border-radius: 999px; border: 1px solid rgba(0,229,255,.7); background: rgba(0,229,255,.08);
    box-shadow: 0 0 0 0 rgba(0,229,255,.6), inset 0 0 22px rgba(0,229,255,.18); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .6s .1s, transform .6s .1s, background .25s; }
  #enter.show { opacity: 1; transform: none; pointer-events: auto; animation: pulse 2.2s ease-out infinite; }
  #enter:hover { background: rgba(0,229,255,.22); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,229,255,.55), inset 0 0 22px rgba(0,229,255,.18); } 100% { box-shadow: 0 0 0 26px rgba(0,229,255,0), inset 0 0 22px rgba(0,229,255,.18); } }
  .hints { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: 15px; color: rgba(255,255,255,.75); }
  .hints span { padding: 6px 12px; border-radius: 8px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .hints b { color: var(--c1); font-weight: 600; }

  /* ---------- HUD ---------- */
  #crosshair { position: fixed; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.55); pointer-events: none; z-index: 1005; display: none; transition: transform .2s, border-color .2s, box-shadow .2s; }
  #crosshair::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: #fff; }
  #crosshair.hot { transform: scale(2); border-color: var(--c1); box-shadow: 0 0 16px var(--c1); }
  #tag { position: fixed; left: 50%; bottom: max(9vh, env(safe-area-inset-bottom)); max-width: 92vw; text-align: center; transform: translate(-50%, 10px); z-index: 1005; opacity: 0; pointer-events: none;
    padding: 12px 22px; border-radius: 999px; background: var(--glass); border: 1px solid rgba(0,229,255,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 16px; letter-spacing: .18em; text-transform: uppercase; box-shadow: 0 0 24px rgba(0,229,255,.25); transition: opacity .25s, transform .25s; }
  #tag.show { opacity: 1; transform: translate(-50%, 0); }
  #tag b { color: var(--c1); }
  #paint-hud { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); max-width: calc(100vw - 28px); z-index: 1005; pointer-events: none; user-select: none; display: none;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.55; }
  .glassbtn { position: fixed; z-index: 1050; cursor: pointer; color: #fff; font-family: var(--display); font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: border-color .2s, box-shadow .2s; }
  .glassbtn:hover { border-color: var(--c1); box-shadow: 0 0 18px rgba(0,229,255,.35); }
  #contact-btn { top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); }

  /* ---------- Croix tactile ---------- */
  #dpad { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: max(22px, env(safe-area-inset-left)); z-index: 1040; display: none;
    grid-template-columns: repeat(3, var(--k)); grid-template-rows: repeat(3, var(--k)); gap: 6px; }
  #dpad button { width: var(--k); height: var(--k); border-radius: 16px; padding: 0; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center;
    background: rgba(10,14,26,.5); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: none; user-select: none; -webkit-user-select: none; }
  #dpad button.active { background: rgba(0,229,255,.35); border-color: var(--c1); box-shadow: 0 0 18px rgba(0,229,255,.6); }
  #dp-up { grid-column: 2; grid-row: 1; } #dp-left { grid-column: 1; grid-row: 2; } #dp-right { grid-column: 3; grid-row: 2; } #dp-down { grid-column: 2; grid-row: 3; }

  /* ---------- Visionneuse plein écran ---------- */
  #viewer { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center; background: rgba(2,3,8,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .35s; }
  #viewer.show { opacity: 1; }
  #v-img { max-width: 92vw; max-height: 82vh; max-height: calc(100dvh - 110px); object-fit: contain; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 0 60px rgba(138,92,255,.35), 0 30px 80px rgba(0,0,0,.7); transition: filter .5s; }
  #v-img.blur { filter: blur(10px); }
  #v-msg { display: none; position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); max-width: 90vw; text-align: center; padding: 8px 14px; border-radius: 8px; background: var(--glass); border: 1px solid rgba(255,134,134,.6); color: #ff8686; font-size: 14px; }
  #v-bar { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 0 10px; font-family: var(--display); font-size: 12px; letter-spacing: .25em; }
  #v-bar button { font: inherit; color: #fff; cursor: pointer; padding: 11px 18px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); }
  #v-bar button:hover { border-color: var(--c1); }
  #v-count { color: rgba(255,255,255,.65); min-width: 80px; text-align: center; }

  /* ---------- Contact ---------- */
  #contact-modal { position: fixed; inset: 0; height: 100dvh; z-index: 2000; background: rgba(2,3,8,.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
  #contact-box { width: 90%; max-width: 400px; max-height: 92dvh; overflow-y: auto; padding: 26px; border-radius: 16px; background: rgba(14,18,32,.85); border: 1px solid var(--line); box-shadow: 0 0 60px rgba(138,92,255,.3); font-family: var(--body); }
  #contact-box h2 { margin: 0 0 16px; font-family: var(--display); font-size: 17px; letter-spacing: .18em; text-transform: uppercase; }
  #contact-box input, #contact-box textarea { width: 100%; margin-bottom: 10px; padding: 11px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff; font: 500 16px var(--body); }
  #contact-box input:focus, #contact-box textarea:focus { outline: none; border-color: var(--c1); box-shadow: 0 0 12px rgba(0,229,255,.3); }
  #contact-box textarea { min-height: 96px; resize: vertical; }
  .c-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .c-actions button { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font: 600 15px var(--body); letter-spacing: .06em; }
  #c-cancel { background: rgba(255,255,255,.14); color: #fff; }
  #c-send { background: linear-gradient(90deg, var(--c1), var(--c2)); color: #05060c; }
  #c-send:disabled { opacity: .6; cursor: default; }
  #c-error { color: #ff8686; font-size: 14px; margin: -4px 0 10px; display: none; }
  #c-status { font-size: 14px; margin: -4px 0 10px; display: none; }

  /* ---------- Adaptation aux écrans ---------- */
  @media (max-width: 520px) {
    .card { padding: 16px; }
    .eyebrow { font-size: 10px; letter-spacing: .38em; margin-bottom: 12px; }
    .sub { font-size: 14px; letter-spacing: .2em; margin: 10px 0 24px; }
    #enter { font-size: 13px; letter-spacing: .3em; padding: 16px 34px 16px 40px; }
    .hints { font-size: 13px; margin-top: 24px; }
    .glassbtn { font-size: 11px; padding: 11px 14px; }
    #v-bar button { padding: 10px 14px; letter-spacing: .15em; }
    #tag { font-size: 13px; letter-spacing: .1em; padding: 10px 16px; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    .card { padding: 8px 20px; }
    .eyebrow { margin-bottom: 6px; font-size: 10px; }
    .title { font-size: clamp(22px, 6vh, 40px); }
    .sub { margin: 6px 0 14px; font-size: 13px; }
    .loadbox { margin-bottom: 14px; }
    #enter { padding: 12px 34px 12px 40px; font-size: 13px; }
    .hints { margin-top: 12px; gap: 6px; font-size: 12px; }
    .hints span { padding: 4px 8px; }
    #dpad { bottom: max(12px, env(safe-area-inset-bottom)); gap: 4px; }
    #tag { bottom: 6vh; }
    #v-img { max-height: calc(100dvh - 70px); }
    #contact-box { padding: 16px; }
    #contact-box h2 { margin-bottom: 10px; font-size: 15px; }
    #contact-box textarea { min-height: 56px; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="intro">
  <div class="grid"></div><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="card">
    <div class="eyebrow">GALERIE VIRTUELLE</div>
    <h1 class="title">ATELIER<br>DELERUE</h1>
    <div class="sub" id="mode-title"><span id="count"></span> œuvres</div>
    <div class="loadbox" id="loadbox">
      <div class="track"><div id="barfill"></div></div>
      <div class="loadtxt"><span id="load-label">Initialisation</span><span id="load-pct">0%</span></div>
    </div>
    <button id="enter">ENTRER</button>
    <div class="hints" id="hints"></div>
  </div>
</div>

<div id="crosshair"></div>
<div id="tag"><b>◈</b>&nbsp; Clic · voir l'œuvre en grand</div>
<div id="paint-hud"></div>
<div id="dpad">
  <button id="dp-up">▲</button><button id="dp-left">◀</button><button id="dp-right">▶</button><button id="dp-down">▼</button>
</div>

<button id="contact-btn" class="glassbtn">✉ Contact</button>

<div id="viewer">
  <img id="v-img" alt="Tableau">
  <div id="v-msg"></div>
  <div id="v-bar"><button id="v-close">FERMER ✕</button></div>
</div>

<div id="contact-modal">
  <div id="contact-box">
    <h2>Contactez-nous</h2>
    <input id="c-name" placeholder="Votre nom" />
    <input id="c-email" placeholder="Votre email" type="email" />
    <textarea id="c-message" placeholder="Votre message"></textarea>
    <div id="c-error">Merci de remplir tous les champs (email valide).</div>
    <div id="c-status"></div>
    <div class="c-actions"><button id="c-cancel">Annuler</button><button id="c-send">Envoyer</button></div>
  </div>
</div>

u2jjLev/1q5z+1/tl1DDr1rCI3n2AsSHXHVjnjA4/OpYre60WOS51Cad4Z25XZnqfvHnIPrWVrF697PGunrC1rJLgyrGJDH04yckDHUentWEHq7bvd+Zda6tboa2o6vqNnqItLSAz2rgkbTjzMdwe2KK0ra9s9PtjZ3wjlmwCGAC+YAew7AZFFOM6lNclBLlXfe50K0ved9fQoRa7Jr7S21vcfZXtnVlYgZkHckHt1BHvVSU4Iuklt4vsjHCQxDexJAHflh2I5INbV9aW1lppvYIUE8qF5CR98gZGaxvB8g1aEvdxR583+AYzgAj9a5KSc6koLaKtrrcJ0r2lcH0GHxHLFPdXKC6ZAzCNSu/2IPQgUVQ8UandaLer9gk2NI772PJIHaiuilF1oKSdltppsJ3h7r1P/2Q=="}]</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CFG = window.GALLERY_CONFIG;
const MANIFEST = JSON.parse(document.getElementById('manifest').textContent);
const TEX_BASE = 'image/';
const $ = (id) => document.getElementById(id);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ------------------------------------------------------------------ */
/*  Mode admin (?adm)                                                   */
/* ------------------------------------------------------------------ */
let isAdmin = window.location.pathname.includes('/adm') || window.location.search.includes('adm');
let ADMIN_KEY = null;
if (isAdmin) {
  const k = window.prompt("Clé d'administration :");
  if (k && k.trim()) ADMIN_KEY = k.trim();
  else { isAdmin = false; alert('Mode visiteur activé.'); }
}
$('count').textContent = MANIFEST.length;
if (isAdmin) $('mode-title').textContent = 'Mode administrateur (Entrée : sauvegarder)';
$('hints').innerHTML = isTouch
  ? '<span><b>Glisse</b> pour regarder</span><span><b>Flèches</b> pour avancer</span><span><b>Touche</b> un tableau pour l\'agrandir</span>'
  : '<span><b>ZQSD</b> se déplacer</span><span><b>Souris</b> regarder</span><span><b>Maj</b> courir</span><span><b>Double-clic</b> marcher</span><span><b>Clic</b> sur un tableau = plein écran</span><span><b>Échap</b> pause</span>';
if (isTouch) $('dpad').style.display = 'grid';

function setProgress(p, label) {
  $('barfill').style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%';
  $('load-pct').textContent = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%';
  if (label) $('load-label').textContent = label;
}

/* ------------------------------------------------------------------ */
/*  Rendu                                                               */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = CFG.toneMapping === 'aces' ? THREE.ACESFilmicToneMapping : THREE.LinearToneMapping;
renderer.toneMappingExposure = CFG.exposure;
renderer.shadowMap.enabled = !!CFG.shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;      // le soleil ne bouge pas : ombres calculées une seule fois
$('stage').appendChild(renderer.domElement);
const maxAniso = Math.min(16, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);

// Reflets réalistes (sol brillant, chrome, verre) grâce à une salle-studio virtuelle
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

// Lumière de fond douce et chaude (le reste vient du soleil et des lampes)
scene.add(new THREE.AmbientLight(0xfff0e0, 0.9 * CFG.ambient));
scene.add(new THREE.HemisphereLight(0xffc89a, 0x1b1622, 1.1 * CFG.ambient));

// Soleil couchant : direction calculée d'après la hauteur et l'orientation des réglages
const SUN_EL = THREE.MathUtils.degToRad(CFG.sunElevation), SUN_AZ = THREE.MathUtils.degToRad(CFG.sunAzimuth);
const sunDir = new THREE.Vector3(Math.sin(SUN_AZ) * Math.cos(SUN_EL), Math.sin(SUN_EL), -Math.cos(SUN_AZ) * Math.cos(SUN_EL)).normalize();
const sun = new THREE.DirectionalLight(CFG.sunColor, CFG.sunIntensity);
sun.castShadow = !!CFG.shadows;
scene.add(sun); scene.add(sun.target);

// Projecteurs des lampes : quelques vrais spots, réaffectés aux tableaux les plus proches du visiteur
const lampSpots = [];
for (let i = 0; i < (isTouch ? 2 : 5); i++) {
  const l = new THREE.SpotLight(CFG.lampColor, 0, 0, 0.8, 0.9, 2);
  scene.add(l); scene.add(l.target);
  lampSpots.push({ light: l, group: null, k: 0, want: 0 });
}

// Post-traitement (PC) : halo lumineux + vignette + aberration chromatique + grain
let composer = null, bloom = null, fxPass = null;
const FXShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: [
    'uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;',
    'float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
    'void main(){',
    '  vec2 c = vUv - 0.5; float d = dot(c, c);',
    '  vec2 off = c * d * 0.003;',
    '  vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);',
    '  col *= 1.0 - smoothstep(0.12, 0.8, d * 1.7) * 0.5;',
    '  col += (h(vUv * vec2(1920.0, 1080.0) + uTime) - 0.5) * 0.014;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
};
function buildComposer() {
  const w = window.innerWidth, h = window.innerHeight, pr = renderer.getPixelRatio();
  const rt = new THREE.WebGLRenderTarget(w * pr, h * pr, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(w, h), CFG.bloom, 0.65, 0.92);
  bloom.enabled = CFG.bloom > 0;
  composer.addPass(bloom);
  fxPass = new ShaderPass(FXShader);
  composer.addPass(fxPass);
  composer.addPass(new OutputPass());
}
if (!isTouch) { try { buildComposer(); } catch (e) { console.warn('Post-traitement indisponible', e); composer = null; } }

/* ------------------------------------------------------------------ */
/*  Contrôles                                                           */
/* ------------------------------------------------------------------ */
const controls = new PointerLockControls(camera, renderer.domElement);
let entered = false, touchEnabled = false, viewerOpen = false, contactOpen = false;
const uiBusy = () => viewerOpen || contactOpen;

const intro = $('intro'), enterBtn = $('enter'), crosshair = $('crosshair');
function showPause() {
  if (!entered) return;
  $('load-label').textContent = 'Pause';
  enterBtn.textContent = 'REPRENDRE';
  intro.classList.remove('out');
  crosshair.style.display = 'none';
}
function baseFov() { const a = window.innerWidth / Math.max(1, window.innerHeight); return a >= 1.2 ? 70 : Math.min(100, 2 * Math.atan(Math.tan(40 * Math.PI / 360 * 2) / a) * 180 / Math.PI); }
function startWarp() { camera.fov = baseFov() + 26; }
enterBtn.addEventListener('click', () => {
  if (!modelReady) return;
  if (!entered) { entered = true; startWarp(); $('hints').style.display = 'none'; }
  if (isTouch) { intro.classList.add('out'); touchEnabled = true; }
  else { try { controls.lock(); } catch (e) { console.warn(e); } }
});
controls.addEventListener('lock', () => { intro.classList.add('out'); crosshair.style.display = 'block'; });
controls.addEventListener('unlock', () => { crosshair.style.display = 'none'; if (!uiBusy()) showPause(); });
document.addEventListener('pointerlockerror', () => { if (!uiBusy()) showPause(); });

const move = { forward: false, back: false, left: false, right: false, run: false, up: false, down: false };
let moveTarget = null, isAutoMoving = false;
const AUTO_ARRIVE = 0.25;

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.code === 'Escape' && viewerOpen) { closeViewer(false); return; }
  if (typing || uiBusy()) return;
  if (isAdmin && e.code === 'Enter') { savePaintings(); return; }
  if (e.code === 'KeyZ' || e.code === 'KeyW' || (e.code === 'ArrowUp' && !isAdmin)) { move.forward = true; isAutoMoving = false; }
  if (e.code === 'KeyS' || (e.code === 'ArrowDown' && !isAdmin)) { move.back = true; isAutoMoving = false; }
  if (e.code === 'KeyQ' || e.code === 'KeyA' || e.code === 'ArrowLeft') { move.left = true; isAutoMoving = false; }
  if (e.code === 'KeyD' || e.code === 'ArrowRight') { move.right = true; isAutoMoving = false; }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.run = true;
  if (isAdmin) {
    if (e.code === 'ArrowUp') selectPainting(currentPaintingIndex + 1);
    if (e.code === 'ArrowDown') selectPainting(currentPaintingIndex - 1);
    if (e.code === 'KeyF') hangCurrentPainting();
    if (e.code === 'KeyG') removeAimedPainting();
    if (e.code === 'KeyI') { paintingScaleMultiplier *= 1.1; updatePaintHud(); }
    if (e.code === 'KeyK') { paintingScaleMultiplier /= 1.1; updatePaintHud(); }
    if (e.code === 'KeyJ') rotateAimedPainting(-CFG.rotationStepDeg);
    if (e.code === 'KeyL') rotateAimedPainting(CFG.rotationStepDeg);
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'KeyZ' || e.code === 'KeyW' || e.code === 'ArrowUp') move.forward = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') move.back = false;
  if (e.code === 'KeyQ' || e.code === 'KeyA' || e.code === 'ArrowLeft') move.left = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') move.right = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.run = false;
});

/* ------------------------------------------------------------------ */
/*  Collisions / raycast                                                */
/* ------------------------------------------------------------------ */
let SCALE = 1, EYE_HEIGHT = CFG.eyeHeight, PLAYER_RADIUS = 0.35, WALK_SPEED = 3.2, RUN_SPEED = 6.0;
const GROUND_SNAP_SPEED = 12;
let MAX_STEP_UP = 0.5, RAY_LOOKAHEAD = 0.05;
const collidableMeshes = [];
const modelBox = new THREE.Box3();
const raycaster = new THREE.Raycaster();
raycaster.firstHitOnly = true; // utilisé par three-mesh-bvh si disponible (on ne lit que le 1er impact)

function raycastFloorY(x, fromY, z) {
  raycaster.set(new THREE.Vector3(x, fromY, z), new THREE.Vector3(0, -1, 0));
  raycaster.far = (fromY - modelBox.min.y) + (2 * SCALE);
  const hits = raycaster.intersectObjects(collidableMeshes, false);
  return hits.length > 0 ? hits[0].point.y : null;
}
function raycastFloorYRobust(x, fromY, z) {
  const r = PLAYER_RADIUS * 0.6;
  const offs = [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]];
  let best = null;
  for (let i = 0; i < offs.length; i++) {
    const fy = raycastFloorY(x + offs[i][0], fromY, z + offs[i][1]);
    if (fy !== null && (best === null || fy > best)) best = fy;
  }
  return best;
}
function raycastCeilingDist(pos) {
  raycaster.set(pos, new THREE.Vector3(0, 1, 0));
  raycaster.far = EYE_HEIGHT + 0.3;
  const hits = raycaster.intersectObjects(collidableMeshes, false);
  return hits.length > 0 ? hits[0].distance : Infinity;
}
function isBlocked(position, direction, distance) {
  if (direction.lengthSq() === 0) return false;
  const dir = direction.clone().normalize();
  const origin = position.clone();
  origin.y = position.y - EYE_HEIGHT + MAX_STEP_UP + (0.05 * SCALE);
  raycaster.set(origin, dir);
  raycaster.far = distance + PLAYER_RADIUS;
  const hits = raycaster.intersectObjects(collidableMeshes, false);
  return hits.length > 0 && hits[0].distance < (PLAYER_RADIUS + RAY_LOOKAHEAD);
}
function getWalkTargetFromRay() {
  const hits = raycaster.intersectObjects(collidableMeshes, false);
  if (hits.length === 0) return null;
  const hit = hits[0];
  const floorY = raycastFloorYRobust(hit.point.x, hit.point.y + (2 * SCALE), hit.point.z);
  return { x: hit.point.x, z: hit.point.z, y: floorY !== null ? floorY : hit.point.y };
}
function startAutoMoveToScreenPoint(cx, cy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const t = getWalkTargetFromRay();
  if (t) { moveTarget = t; isAutoMoving = true; }
}
function startAutoMoveToCrosshair() {
  raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
  raycaster.far = 200 * SCALE;
  const t = getWalkTargetFromRay();
  if (t) { moveTarget = t; isAutoMoving = true; }
}
renderer.domElement.addEventListener('dblclick', () => { if (controls.isLocked) startAutoMoveToCrosshair(); });

/* Accélération des collisions (three-mesh-bvh) : chargée en option, construite pendant l'écran d'accueil */
async function setupBVH(meshes) {
  try {
    const m = await import('https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js');
    THREE.BufferGeometry.prototype.computeBoundsTree = m.computeBoundsTree;
    THREE.BufferGeometry.prototype.disposeBoundsTree = m.disposeBoundsTree;
    THREE.Mesh.prototype.raycast = m.acceleratedRaycast;
    const queue = meshes.filter((x) => x.geometry && x.geometry.attributes.position.count > 200)
      .sort((a, b) => b.geometry.attributes.position.count - a.geometry.attributes.position.count);
    const step = () => {
      const t0 = performance.now();
      while (queue.length && performance.now() - t0 < 8) {
        const mesh = queue.shift();
        try { mesh.geometry.computeBoundsTree(); } catch (e) { /* on garde le raycast normal pour ce maillage */ }
      }
      if (queue.length) setTimeout(step, 0);
    };
    setTimeout(step, 50);
  } catch (e) { console.warn('Accélération des collisions indisponible (le site fonctionne quand même)', e); }
}

const touchLook = { active: false, id: null, lastX: 0, lastY: 0, startX: 0, startY: 0, moved: false };
const touchRot = { yaw: 0, pitch: 0 };
const T_SENS = 0.0022, T_SMOOTH = 0.18, T_MAXD = 40;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (!touchEnabled || touchLook.active) return;
  const t = e.changedTouches[0];
  touchLook.active = true; touchLook.id = t.identifier; touchLook.moved = false;
  touchLook.lastX = touchLook.startX = t.clientX; touchLook.lastY = touchLook.startY = t.clientY;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!touchEnabled || !touchLook.active) return;
  let t = null;
  for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === touchLook.id) { t = e.changedTouches[i]; break; }
  if (!t) return;
  e.preventDefault();
  const dx = Math.max(-T_MAXD, Math.min(T_MAXD, t.clientX - touchLook.lastX));
  const dy = Math.max(-T_MAXD, Math.min(T_MAXD, t.clientY - touchLook.lastY));
  touchLook.lastX = t.clientX; touchLook.lastY = t.clientY;
  if (Math.abs(t.clientX - touchLook.startX) > 8 || Math.abs(t.clientY - touchLook.startY) > 8) touchLook.moved = true;
  touchRot.yaw -= dx * T_SENS; touchRot.pitch -= dy * T_SENS;
  const M = 0.35;
  touchRot.yaw = Math.max(-M, Math.min(M, touchRot.yaw));
  touchRot.pitch = Math.max(-M, Math.min(M, touchRot.pitch));
}, { passive: false });
function endTouch(e) {
  if (!touchEnabled || !touchLook.active) return;
  let ended = false;
  for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === touchLook.id) { ended = true; break; }
  if (!ended) return;
  if (!touchLook.moved) {
    const idx = paintingAtScreenPoint(touchLook.startX, touchLook.startY);
    if (idx >= 0 && !isAdmin) { if (e.cancelable) e.preventDefault(); openViewer(idx); }
    else startAutoMoveToScreenPoint(touchLook.startX, touchLook.startY);
  }
  touchLook.active = false; touchLook.id = null;
}
renderer.domElement.addEventListener('touchend', endTouch);
renderer.domElement.addEventListener('touchcancel', endTouch);
function applyTouchLook() {
  if (Math.abs(touchRot.yaw) < 0.00003 && Math.abs(touchRot.pitch) < 0.00003) return;
  const ay = touchRot.yaw * T_SMOOTH, ap = touchRot.pitch * T_SMOOTH;
  camera.rotation.y += ay;
  camera.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camera.rotation.x + ap));
  touchRot.yaw -= ay; touchRot.pitch -= ap;
}
function setupDpad(id, key) {
  const btn = $(id);
  const start = (e) => { e.preventDefault(); e.stopPropagation(); move[key] = true; isAutoMoving = false; btn.classList.add('active'); };
  const stop = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } move[key] = false; btn.classList.remove('active'); };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', stop, { passive: false });
  btn.addEventListener('touchcancel', stop, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
}
setupDpad('dp-up', 'forward'); setupDpad('dp-down', 'back'); setupDpad('dp-left', 'left'); setupDpad('dp-right', 'right');

/*  Tableaux : affichage instantané (miniature floue -> image nette)   */

const texLoader = new THREE.TextureLoader();
/* Cherche l'image sous plusieurs extensions (webp, jpg, jpeg, png) et retient celle qui marche */
const IMG_EXTS = ['webp', 'jpg', 'jpeg', 'png'];
let learnedExt = null, missCount = 0;
function loadFirst(dir, n) {
  if (!learnedExt && missCount >= 4 && dir === TEX_BASE) return Promise.reject(new Error('dossier images introuvable'));
  const order = learnedExt ? [learnedExt].concat(IMG_EXTS.filter((e) => e !== learnedExt)) : IMG_EXTS;
  let i = 0;
  const attempt = () => {
    if (i >= order.length) { if (!learnedExt) missCount++; return Promise.reject(new Error('introuvable : ' + dir + n)); }
    const ext = order[i++], img = new Image();
    img.decoding = 'async';
    img.src = dir + n + '.' + ext;
    return img.decode().then(() => { if (dir === TEX_BASE) learnedExt = ext; return img; }, attempt);
  };
  return attempt();
}
const lqCache = new Map();
function lqTexture(idx) {
  let t = lqCache.get(idx);
  if (!t) {
    t = texLoader.load(MANIFEST[idx].l);
    t.colorSpace = THREE.SRGBColorSpace;
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
    lqCache.set(idx, t);
  }
  return t;
}
const fullEntries = new Map();      // idx -> { tex, cbs }
const loadQueue = [];
const uploadQueue = [];
const idxPos = new Map();           // idx -> Vector3 (pour charger d'abord les tableaux proches)
let activeLoads = 0;

function requestFull(idx, cb) {
  let e = fullEntries.get(idx);
  if (e) { if (e.tex) cb(e.tex); else e.cbs.push(cb); return; }
  e = { tex: null, cbs: [cb] };
  fullEntries.set(idx, e);
  loadQueue.push(idx);
  pumpLoads();
}
function pumpLoads() {
  while (activeLoads < 6 && loadQueue.length) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < loadQueue.length; i++) {
      const p = idxPos.get(loadQueue[i]);
      const d = p ? p.distanceToSquared(camera.position) : 0;
      if (d < bd) { bd = d; bi = i; }
    }
    const idx = loadQueue.splice(bi, 1)[0];
    activeLoads++;
    loadFirst(TEX_BASE, MANIFEST[idx].n).then((img) => {
      const tex = new THREE.Texture(img);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      tex.needsUpdate = true;
      uploadQueue.push({ idx, tex });
    }).catch((err) => console.warn('Image introuvable : ' + TEX_BASE + MANIFEST[idx].n, err))
      .then(() => { activeLoads--; pumpLoads(); });
  }
}
function processUploads() {
  const n = isTouch ? 1 : 2;
  for (let i = 0; i < n && uploadQueue.length; i++) {
    const u = uploadQueue.shift();
    try { renderer.initTexture(u.tex); } catch (e) { /* upload au 1er rendu */ }
    const e = fullEntries.get(u.idx);
    e.tex = u.tex;
    e.cbs.forEach((cb) => cb(u.tex));
    e.cbs = [];
  }
}

const frameMat = new THREE.MeshStandardMaterial({ color: 0x0b0c12, metalness: 0.9, roughness: 0.32 });
const lightBarMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.1, 1.7) });
const paintVert = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
const paintFrag = [
  'uniform sampler2D uA; uniform sampler2D uB; uniform float uMix; uniform float uHover; varying vec2 vUv;',
  'void main(){',
  '  vec3 c = mix(texture2D(uA, vUv).rgb, texture2D(uB, vUv).rgb, uMix);',
  '  c *= 0.95 + 0.14 * smoothstep(0.35, 1.0, vUv.y);',
  '  c *= 1.0 + uHover * 0.2;',
  '  float e = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));',
  '  c += vec3(0.0, 0.9, 1.0) * uHover * (1.0 - smoothstep(0.0, 0.02, e));',
  '  gl_FragColor = vec4(c, 1.0);',
  '  #include <tonemapping_fragment>',
  '  #include <colorspace_fragment>',
  '}'
].join('\n');

const paintingGroups = [];
const canvases = [];        // maillages "toile" (survol / clic)
const placedPaintings = [];  // admin
const fades = [];

function applyPaintingOrientation(obj, normal, rotationDeg) {
  const align = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
  const spin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), THREE.MathUtils.degToRad(rotationDeg || 0));
  obj.quaternion.copy(align).multiply(spin);
}

function createPainting(rec) {
  const m = MANIFEST[rec.index];
  if (!m) return null;
  const group = new THREE.Group();
  group.position.set(rec.position.x, rec.position.y, rec.position.z);
  const normal = new THREE.Vector3(rec.normal.x, rec.normal.y, rec.normal.z);
  applyPaintingOrientation(group, normal, rec.rotation || 0);

  const w = rec.width, h = rec.height;
  const lq = lqTexture(rec.index);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uA: { value: lq }, uB: { value: lq }, uMix: { value: 0 }, uHover: { value: 0 } },
    vertexShader: paintVert, fragmentShader: paintFrag, side: THREE.DoubleSide
  });
  const canvas = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  canvas.userData.index = rec.index;
  canvas.userData.own = true;
  group.add(canvas);

  // cadre métallique sombre
  const b = 0.04 * SCALE, d = 0.02 * SCALE, z = 0.003 * SCALE;
  const bar = (gw, gh, x, y) => { const mesh = new THREE.Mesh(new THREE.BoxGeometry(gw, gh, d), frameMat); mesh.position.set(x, y, z); group.add(mesh); };
  bar(w + 2 * b, b, 0, h / 2 + b / 2); bar(w + 2 * b, b, 0, -h / 2 - b / 2); bar(b, h, -w / 2 - b / 2, 0); bar(b, h, w / 2 + b / 2, 0);

  // lampe à bras (comme dans une vraie galerie) : le faisceau part de la lampe, plus du mur
  const lampW = Math.max(0.35 * SCALE, Math.min(w * 0.55, 1.4 * SCALE));
  const lampY = h / 2 + b + 0.16 * SCALE, armL = 0.3 * SCALE;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.02 * SCALE, 0.02 * SCALE, armL), frameMat);
  arm.position.set(0, lampY, armL / 2);
  const head = new THREE.Mesh(new THREE.BoxGeometry(lampW, 0.045 * SCALE, 0.075 * SCALE), frameMat);
  head.position.set(0, lampY, armL);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(lampW * 0.9, 0.006 * SCALE, 0.05 * SCALE), lightBarMat);
  strip.position.set(0, lampY - 0.024 * SCALE, armL);
  group.add(arm, head, strip);
  group.userData.w = w; group.userData.h = h;
  group.userData.lamp = new THREE.Vector3(0, lampY - 0.03 * SCALE, armL);   // point d'où part la lumière
  group.userData.aim = new THREE.Vector3(0, -h * 0.1, 0);                  // le faisceau vise le tableau

  scene.add(group);
  paintingGroups.push(group);
  canvases.push(canvas);
  if (!idxPos.has(rec.index)) idxPos.set(rec.index, group.position.clone());

  // l'image nette arrive en fondu par-dessus la miniature floue
  const ready = fullEntries.get(rec.index);
  if (ready && ready.tex) { mat.uniforms.uB.value = ready.tex; mat.uniforms.uMix.value = 1; }
  else requestFull(rec.index, (tex) => { mat.uniforms.uB.value = tex; fades.push(mat.uniforms.uMix); });
  return { group, canvas, record: rec };
}

function clearPaintings() {
  paintingGroups.forEach((g) => {
    scene.remove(g);
    g.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.userData && o.userData.own && o.material) o.material.dispose();
    });
  });
  hdState.forEach((v) => { if (v.tex) v.tex.dispose(); }); hdState.clear();
  paintingGroups.length = 0; canvases.length = 0; placedPaintings.length = 0; fades.length = 0;
}

/* Données (positions) : cache local = affichage instantané aux visites suivantes */
const CACHE_KEY = 'atelier_positions_v2';
function readCache() { try { const a = JSON.parse(localStorage.getItem(CACHE_KEY)); return Array.isArray(a) ? a : null; } catch (e) { return null; } }
function writeCache(a) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(a)); } catch (e) { /* ignoré */ } }
let records = null, recordsSig = '', modelReady = false, appliedOnce = false;
function applyRecords() {
  if (!modelReady || records === null) return;
  if (isAdmin && appliedOnce) return;           // ne jamais écraser un travail d'admin en cours
  appliedOnce = true;
  clearPaintings();
  records.forEach((rec) => {
    const p = createPainting(rec);
    if (p && isAdmin) placedPaintings.push({ mesh: p.canvas, group: p.group, record: rec });
  });
  if (isAdmin) updatePaintHud();
}
function setRecords(arr) {
  const sig = JSON.stringify(arr);
  if (sig === recordsSig) return;
  recordsSig = sig; records = arr; applyRecords();
}
if (!isAdmin) { const c = readCache(); if (c) setRecords(c); }
window.__early.remote.then((arr) => {
  if (arr) { writeCache(arr); setRecords(arr); }
  else if (records === null) setRecords(readCache() || []);
});


/* Haute définition : les tableaux proches passent en version HD (hd/<nom>.webp) */
const hdState = new Map();            // idx -> { state: 'loading' | 'ready' | 'fail', tex }
let hdLoading = 0;
const HD_RANGE = () => 8 * SCALE, HD_KEEP = isTouch ? 4 : 10;
function setPaintingTex(idx, tex) {
  canvases.forEach((c) => { if (c.userData.index === idx) { c.material.uniforms.uB.value = tex; c.material.uniforms.uMix.value = 1; } });
}
function loadHD(idx) {
  hdState.set(idx, { state: 'loading', tex: null }); hdLoading++;
  loadFirst(TEX_BASE + 'hd/', MANIFEST[idx].n).then((img) => {
    const tex = new THREE.Texture(img);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso; tex.needsUpdate = true;
    try { renderer.initTexture(tex); } catch (e) { /* upload au 1er rendu */ }
    hdState.set(idx, { state: 'ready', tex });
    setPaintingTex(idx, tex);
  }).catch(() => { hdState.set(idx, { state: 'fail', tex: null }); })
    .then(() => { hdLoading--; });
}
function updateHD() {
  if (!modelReady || !canvases.length) return;
  const cp = camera.position, R2 = HD_RANGE() * HD_RANGE();
  let best = -1, bd = Infinity;
  for (let i = 0; i < canvases.length; i++) {
    const idx = canvases[i].userData.index;
    if (hdState.has(idx)) continue;
    const d = canvases[i].parent.position.distanceToSquared(cp);
    if (d < R2 && d < bd) { bd = d; best = idx; }
  }
  if (best >= 0 && hdLoading < 2) loadHD(best);
  // libère les HD les plus éloignées (mémoire, surtout sur mobile)
  const ready = [];
  hdState.forEach((v, idx) => { if (v.state === 'ready') ready.push(idx); });
  if (ready.length > HD_KEEP) {
    let far = -1, fd = -1;
    ready.forEach((idx) => {
      const c = canvases.find((k) => k.userData.index === idx);
      const d = c ? c.parent.position.distanceToSquared(cp) : Infinity;
      if (d > fd) { fd = d; far = idx; }
    });
    if (far >= 0) {
      const v = hdState.get(far), full = fullEntries.get(far);
      setPaintingTex(far, (full && full.tex) || lqTexture(far));
      v.tex.dispose(); hdState.delete(far);
    }
  }
}

/* Survol / clic sur un tableau */
const hoverRay = new THREE.Raycaster();
let hoveredCanvas = null;
function paintingAtScreenPoint(cx, cy) {
  const rect = renderer.domElement.getBoundingClientRect();
  hoverRay.setFromCamera(new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1), camera);
  hoverRay.far = 60 * SCALE;
  const hit = hoverRay.intersectObjects(canvases, false)[0];
  return hit ? hit.object.userData.index : -1;
}
let hoverTimer = 0;
function updateHover(dt) {
  hoverTimer += dt;
  if (hoverTimer > 0.08) {
    hoverTimer = 0;
    updateHD();
    let found = null;
    if (controls.isLocked && !isAdmin && !uiBusy() && canvases.length) {
      hoverRay.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
      hoverRay.far = 14 * SCALE;
      const hit = hoverRay.intersectObjects(canvases, false)[0];
      if (hit) found = hit.object;
    }
    hoveredCanvas = found;
    crosshair.classList.toggle('hot', !!found);
    $('tag').classList.toggle('show', !!found);
  }
  for (let i = 0; i < canvases.length; i++) {
    const u = canvases[i].material.uniforms.uHover;
    const target = canvases[i] === hoveredCanvas ? 1 : 0;
    if (u.value !== target) u.value += (target - u.value) * Math.min(1, dt * 10);
    if (Math.abs(u.value - target) < 0.01) u.value = target;
  }
}
renderer.domElement.addEventListener('click', () => {
  if (!controls.isLocked || isAdmin || uiBusy()) return;
  let idx = hoveredCanvas ? hoveredCanvas.userData.index : -1;
  if (idx < 0) {                                  // le survol se met à jour 12x/s : on revérifie au moment du clic
    hoverRay.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
    hoverRay.far = 14 * SCALE;
    const hit = hoverRay.intersectObjects(canvases, false)[0];
    if (hit) idx = hit.object.userData.index;
  }
  if (idx >= 0) openViewer(idx);
});

/* Visionneuse plein écran */
let viewerIdx = 0, viewerOpenedAt = 0;
function openViewer(idx) {
  viewerOpen = true; viewerIdx = idx; viewerOpenedAt = Date.now();
  if (controls.isLocked) controls.unlock();
  Object.keys(move).forEach((k) => { move[k] = false; });
  $('tag').classList.remove('show');
  showViewerImage();
  const v = $('viewer'); v.style.display = 'flex';
  requestAnimationFrame(() => v.classList.add('show'));
}
function showViewerImage() {
  const m = MANIFEST[viewerIdx], img = $('v-img'), msg = $('v-msg');
  const cur = () => MANIFEST[viewerIdx] === m;
  msg.style.display = 'none';
  // taille calculée d'après les proportions du tableau : même la miniature est affichée en grand
  const availH = Math.max(120, window.innerHeight - 100), availW = window.innerWidth * 0.92;
  img.style.width = Math.round(Math.min(availW, availH * (m.w / m.h))) + 'px';
  img.style.height = 'auto';
  img.classList.add('blur');
  img.onerror = null;
  img.src = m.l;                                              // miniature immédiate (floue)
  let hdDone = false;
  loadFirst(TEX_BASE, m.n).then((im) => {
    if (cur() && !hdDone) { img.src = im.src; img.classList.remove('blur'); }
  }, () => {
    if (!cur()) return;
    img.classList.remove('blur');
    msg.textContent = "Image introuvable sur le site (dossier « paintings »)";
    msg.style.display = 'block';
  });
  loadFirst(TEX_BASE + 'hd/', m.n).then((im) => {
    if (cur()) { hdDone = true; img.src = im.src; img.classList.remove('blur'); msg.style.display = 'none'; }
  }, () => {});
  setTimeout(() => { if (cur()) img.classList.remove('blur'); }, 1200);
}
function closeViewer(relock) {
  if (!viewerOpen) return;
  viewerOpen = false;
  const v = $('viewer'); v.classList.remove('show');
  setTimeout(() => { if (!viewerOpen) v.style.display = 'none'; }, 350);
  if (isTouch) return;
  if (relock) { try { controls.lock(); } catch (e) { showPause(); } } else showPause();
}
$('v-close').addEventListener('click', () => closeViewer(true));
$('viewer').addEventListener('click', (e) => { if (e.target === $('viewer') && Date.now() - viewerOpenedAt > 500) closeViewer(true); });

/* ------------------------------------------------------------------ */
/*  Administration (placement des tableaux)                            */
/* ------------------------------------------------------------------ */
let currentPaintingIndex = 0, paintingScaleMultiplier = 1, nextPaintingRotationDeg = 0;
const paintHud = $('paint-hud');
function updatePaintHud() {
  if (!isAdmin) return;
  paintHud.style.display = 'block';
  paintHud.innerHTML = 'Tableau ' + (currentPaintingIndex + 1) + ' / ' + MANIFEST.length + ' — ' + MANIFEST[currentPaintingIndex].n + '<br>' +
    '↑ / ↓ changer &nbsp; F poser &nbsp; G retirer &nbsp; [I]/[K] taille (x' + paintingScaleMultiplier.toFixed(2) + ')<br>' +
    '[J]/[L] tourner (viser un tableau posé, sinon le prochain : ' + Math.round(nextPaintingRotationDeg) + '°)<br>' +
    '<b>[ENTRÉE] ENREGISTRER LES TABLEAUX POUR TOUS</b>';
}
function selectPainting(i) {
  if (!isAdmin) return;
  currentPaintingIndex = ((i % MANIFEST.length) + MANIFEST.length) % MANIFEST.length;
  updatePaintHud();
}
function adminActive() { return isAdmin && (controls.isLocked || touchEnabled); }
function hangCurrentPainting() {
  if (!adminActive()) return;
  raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
  raycaster.far = 100 * SCALE;
  const hits = raycaster.intersectObjects(collidableMeshes, false);
  if (hits.length === 0) return;
  const hit = hits[0];
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
  const m = MANIFEST[currentPaintingIndex];
  const baseHeight = 1.1 * SCALE * paintingScaleMultiplier;
  const baseWidth = baseHeight * (m.w / m.h);
  const pos = hit.point.clone().addScaledVector(normal, 0.02 * SCALE);
  const rec = {
    index: currentPaintingIndex,
    position: { x: pos.x, y: pos.y, z: pos.z },
    normal: { x: normal.x, y: normal.y, z: normal.z },
    width: baseWidth, height: baseHeight, rotation: nextPaintingRotationDeg
  };
  const p = createPainting(rec);
  if (p) placedPaintings.push({ mesh: p.canvas, group: p.group, record: rec });
}
function rotateAimedPainting(deltaDeg) {
  if (!adminActive()) return;
  if (placedPaintings.length > 0) {
    raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
    raycaster.far = 100 * SCALE;
    const hit = raycaster.intersectObjects(placedPaintings.map((p) => p.mesh), false)[0];
    if (hit) {
      const item = placedPaintings.find((p) => p.mesh === hit.object);
      if (item) {
        const rec = item.record;
        rec.rotation = (rec.rotation || 0) + deltaDeg;
        applyPaintingOrientation(item.group, new THREE.Vector3(rec.normal.x, rec.normal.y, rec.normal.z), rec.rotation);
        return;
      }
    }
  }
  nextPaintingRotationDeg += deltaDeg;
  updatePaintHud();
}
function removeAimedPainting() {
  if (!adminActive() || placedPaintings.length === 0) return;
  raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));
  raycaster.far = 100 * SCALE;
  const hit = raycaster.intersectObjects(placedPaintings.map((p) => p.mesh), false)[0];
  if (!hit) return;
  const i = placedPaintings.findIndex((p) => p.mesh === hit.object);
  if (i === -1) return;
  const item = placedPaintings.splice(i, 1)[0];
  scene.remove(item.group);
  const ci = canvases.indexOf(item.mesh); if (ci >= 0) canvases.splice(ci, 1);
  const gi = paintingGroups.indexOf(item.group); if (gi >= 0) paintingGroups.splice(gi, 1);
  item.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.userData && o.userData.own && o.material) o.material.dispose(); });
}
function putPaintings(headerName, recs) {
  const headers = { 'Content-Type': 'application/json' };
  headers[headerName] = ADMIN_KEY;
  return fetch('https://api.jsonbin.io/v3/b/' + CFG.binId, { method: 'PUT', headers, body: JSON.stringify({ paintings: recs }) });
}
function savePaintings() {
  if (!isAdmin) return;
  const recs = placedPaintings.map((p) => p.record);
  putPaintings('X-Master-Key', recs)
    .then((res) => (res.status === 401 || res.status === 403) ? putPaintings('X-Access-Key', recs) : res)
    .then((res) => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      writeCache(recs);
      alert("Succès ! Les positions des tableaux ont été enregistrées. Elles s'afficheront désormais pour tous les visiteurs.");
    })
    .catch((err) => {
      const m = String((err && err.message) || err);
      const hint = /40[13]/.test(m) ? "La clé a été refusée : ce n'est pas celle du compte qui possède le bin (ou elle n'a pas le droit de modifier)."
        : /404/.test(m) ? "Bin introuvable : vérifie l'identifiant du bin."
        : /429/.test(m) ? 'Trop de requêtes jsonbin, réessaie plus tard.'
        : 'Problème de connexion ou de blocage du navigateur.';
      alert("Échec de l'enregistrement (" + m + ').\n' + hint);
      console.error(err);
    });
}

/* ------------------------------------------------------------------ */
/*  Ambiance : lumières néon, poussière lumineuse                       */
/* ------------------------------------------------------------------ */
let dust = null, dustMat = null, sky = null, shaftMat = null;

/* Ciel de coucher de soleil (visible à travers la verrière) */
function buildSky() {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uSun: { value: sunDir } },
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position.z = gl_Position.w; }',
    fragmentShader: [
      'uniform vec3 uSun; varying vec3 vD;',
      'void main(){',
      '  vec3 d = normalize(vD);',
      '  float h = clamp(d.y, 0.0, 1.0);',
      '  vec3 col = mix(vec3(1.0, 0.52, 0.2), vec3(0.62, 0.3, 0.38), smoothstep(0.0, 0.22, h));',
      '  col = mix(col, vec3(0.06, 0.09, 0.24), smoothstep(0.18, 0.85, h));',
      '  float s = max(dot(d, normalize(uSun)), 0.0);',
      '  col += vec3(1.0, 0.58, 0.28) * pow(s, 5.0) * 0.8 + vec3(1.0, 0.86, 0.62) * pow(s, 220.0) * 4.0;',
      '  col = mix(vec3(0.1, 0.07, 0.09), col, smoothstep(-0.12, 0.0, d.y));',
      '  gl_FragColor = vec4(col, 1.0);',
      '  #include <tonemapping_fragment>',
      '  #include <colorspace_fragment>',
      '}'
    ].join('\n'),
    side: THREE.BackSide, depthWrite: false
  });
  sky = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), mat);
  sky.scale.setScalar(50);
  sky.frustumCulled = false; sky.renderOrder = -1000;
  scene.add(sky);
}
buildSky();

/* Soleil qui entre par la verrière : ombres de la structure + rayons visibles dans l'air */
function buildSunlight(glassMeshes, center, size) {
  const R = size.length() * 0.5 + 1;
  sun.target.position.copy(center);
  sun.position.copy(center).addScaledVector(sunDir, R * 1.05);
  sun.target.updateMatrixWorld();
  if (CFG.shadows) {
    const sc = sun.shadow.camera;
    sc.left = -R; sc.right = R; sc.top = R; sc.bottom = -R; sc.near = 0.1; sc.far = R * 2.2;
    sc.updateProjectionMatrix();
    sun.shadow.mapSize.set(isTouch ? 2048 : 4096, isTouch ? 2048 : 4096);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04 * SCALE;
    renderer.shadowMap.needsUpdate = true;
  }
  // la verrière = la vitre la plus haute du modèle
  let top = null;
  glassMeshes.forEach((m) => { const bx = new THREE.Box3().setFromObject(m); if (!top || bx.max.y > top.max.y) top = bx; });
  if (!top || !(CFG.skyShafts > 0)) return;
  const sz = top.getSize(new THREE.Vector3()), c = top.getCenter(new THREE.Vector3());
  const topY = top.min.y + sz.y * 0.5, floorY = modelBox.min.y + 0.5 * SCALE;
  const drop = Math.max(1, topY - floorY);
  const T = sunDir.clone().multiplyScalar(-drop / Math.sin(SUN_EL));      // trajet de la lumière, de la verrière au sol
  const geo = new THREE.BoxGeometry(Math.max(sz.x, 0.5), 1, Math.max(sz.z, 0.5));
  const pos = geo.attributes.position, aT = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    const t = 0.5 - pos.getY(i);                                         // 0 sous la verrière, 1 au sol
    aT[i] = t;
    pos.setXYZ(i, pos.getX(i) + T.x * t, T.y * t, pos.getZ(i) + T.z * t);
  }
  geo.setAttribute('aT', new THREE.BufferAttribute(aT, 1));
  shaftMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uStr: { value: CFG.skyShafts }, uCol: { value: new THREE.Color(1.0, 0.62, 0.28) } },
    vertexShader: [
      'attribute float aT; varying float vT; varying vec3 vN; varying vec3 vW;',
      'void main(){ vT = aT; vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }'
    ].join('\n'),
    fragmentShader: [
      'uniform float uTime; uniform float uStr; uniform vec3 uCol; varying float vT; varying vec3 vN; varying vec3 vW;',
      'void main(){',
      '  vec3 V = normalize(cameraPosition - vW);',
      '  float f = pow(abs(dot(normalize(vN), V)), 1.3);',
      '  float fade = smoothstep(0.0, 0.1, vT) * (1.0 - smoothstep(0.5, 1.0, vT));',
      '  float n = 0.78 + 0.22 * sin(vW.x * 0.7 + uTime * 0.2) * sin(vW.z * 0.9 - uTime * 0.15);',
      '  gl_FragColor = vec4(uCol, f * fade * n * uStr);',
      '}'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
  const shaft = new THREE.Mesh(geo, shaftMat);
  shaft.position.set(c.x, topY, c.z);
  shaft.frustumCulled = false; shaft.renderOrder = 5;
  scene.add(shaft);
}

/* Lampes : les spots se déplacent vers les tableaux les plus proches, avec un fondu doux */
function aimLamp(s, g) {
  const u = g.userData; if (!u.lamp) return;
  g.updateMatrixWorld(true);
  s.group = g;
  s.light.position.copy(u.lamp).applyMatrix4(g.matrixWorld);
  s.light.target.position.copy(u.aim).applyMatrix4(g.matrixWorld);
  s.light.target.updateMatrixWorld();
  const dist = s.light.position.distanceTo(s.light.target.position);
  const r = 0.55 * Math.hypot(u.w, u.h) + 0.25 * SCALE;
  s.light.angle = Math.max(0.4, Math.min(1.2, Math.atan2(r, dist)));
  s.light.distance = 12 * SCALE;
}
function pickLamps() {
  const cp = camera.position, R2 = Math.pow(16 * SCALE, 2), c = [];
  for (const g of paintingGroups) { const d = g.position.distanceToSquared(cp); if (d < R2) c.push([d, g]); }
  c.sort((a, b) => a[0] - b[0]);
  const sel = new Set(c.slice(0, lampSpots.length).map((x) => x[1])), have = new Set();
  lampSpots.forEach((s) => { s.want = (s.group && sel.has(s.group)) ? 1 : 0; if (s.want) have.add(s.group); });
  sel.forEach((g) => {
    if (have.has(g)) return;
    const s = lampSpots.find((x) => !x.want && x.k < 0.03);
    if (!s) return;
    aimLamp(s, g); s.want = 1; have.add(g);
  });
}
let lampTimer = 0;
function updateLights(dt, t) {
  if (sky) sky.position.copy(camera.position);
  if (shaftMat) shaftMat.uniforms.uTime.value = t;
  lampTimer += dt;
  if (lampTimer > 0.3) { lampTimer = 0; pickLamps(); }
  const I = CFG.lampIntensity * SCALE * SCALE;
  for (const s of lampSpots) {
    s.k += (s.want - s.k) * Math.min(1, dt * 5);
    if (!s.want && s.k < 0.005) s.k = 0;
    s.light.intensity = I * s.k;
  }
}

/* Poussière en suspension (chaude, discrète) */
function buildAtmosphere(center, size) {
  const N = isTouch ? 160 : 520, BOX = new THREE.Vector3(36, 16, 36);
  const pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = Math.random() * BOX.x; pos[i * 3 + 1] = Math.random() * BOX.y; pos[i * 3 + 2] = Math.random() * BOX.z; seed[i] = Math.random(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  dustMat = new THREE.ShaderMaterial({
    uniforms: { uCam: { value: new THREE.Vector3() }, uTime: { value: 0 }, uBox: { value: BOX }, uPx: { value: renderer.getPixelRatio() } },
    vertexShader: [
      'uniform vec3 uCam; uniform float uTime; uniform vec3 uBox; uniform float uPx; attribute float aSeed; varying float vA;',
      'void main(){',
      '  vec3 p = position + vec3(sin(uTime * 0.11 + aSeed * 40.0), uTime * 0.05 * (0.3 + aSeed), cos(uTime * 0.09 + aSeed * 31.0)) * 0.8;',
      '  vec3 d = mod(p - uCam + uBox * 0.5, uBox) - uBox * 0.5;',
      '  vec4 mv = viewMatrix * vec4(uCam + d, 1.0);',
      '  gl_Position = projectionMatrix * mv;',
      '  float dist = max(-mv.z, 0.5);',
      '  gl_PointSize = uPx * clamp((22.0 + aSeed * 30.0) / dist, 1.2, 7.0);',
      '  vA = (0.3 + 0.7 * fract(aSeed * 7.7 + uTime * 0.25)) * (1.0 - smoothstep(0.25, 0.5, length(d / uBox)));',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying float vA;',
      'void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a;',
      '  gl_FragColor = vec4(vec3(1.0, 0.84, 0.62), a * vA * 0.32); }'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  dust = new THREE.Points(g, dustMat);
  dust.frustumCulled = false;
  scene.add(dust);
}

/* ------------------------------------------------------------------ */
/*  Chargement du modèle 3D                                            */
/* ------------------------------------------------------------------ */
const gltfLoader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
gltfLoader.setDRACOLoader(draco);
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

async function downloadModel() {
  const res = await window.__early.glb;
  const total = Number(res.headers.get('content-length')) || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    setProgress((total ? got / total : Math.min(0.95, got / 32e6)) * 0.85, 'Chargement');
  }
  const buf = new Uint8Array(got); let o = 0;
  for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf.buffer;
}

function onModelBuilt(gltf) {
  const model = gltf.scene;
  const seen = new Set(), glassMeshes = [];
  model.traverse((child) => {
    if (!child.isMesh) return;
    child.frustumCulled = true;
    collidableMeshes.push(child);
    const ms = Array.isArray(child.material) ? child.material : [child.material];
    const isGlass = ms.some((x) => x && x.name === 'glass');
    child.castShadow = !isGlass; child.receiveShadow = !isGlass;     // la vitre laisse passer le soleil
    if (isGlass) glassMeshes.push(child);
    const mats = Array.isArray(child.material) ? child.material : [child.material];
    mats.forEach((m) => {
      if (!m || seen.has(m)) return;
      seen.add(m);
      m.side = THREE.DoubleSide; m.transparent = false; m.opacity = 1.0;
      const emissive = m.emissive && (m.emissive.r + m.emissive.g + m.emissive.b) > 0.01;
      if (m.color) {
        if (/^painting_\d+$/.test(m.name || '')) m.color.setScalar(0.03);   // emplacements vides : sombres, comme avant
        else m.color.multiplyScalar(emissive ? CFG.darken * 0.5 : CFG.darken);
      }
      if ('envMapIntensity' in m) m.envMapIntensity = 0.6;
      if (m.name === 'floor') { m.roughness = 0.3; m.envMapIntensity = 1.2; }
      if (m.name === 'chrome') m.envMapIntensity = 1.4;
      if (m.name === 'glass') m.envMapIntensity = 1.2;
      if (m.name === 'white' && m.emissive) m.emissive.multiplyScalar(CFG.wallGlow);   // les structures ne brillent plus d'elles-mêmes
      m.needsUpdate = true;
    });
  });
  scene.add(model);

  modelBox.setFromObject(model);
  const center = modelBox.getCenter(new THREE.Vector3());
  const size = modelBox.getSize(new THREE.Vector3());
  const diagonal = size.length();
  SCALE = diagonal / 20;
  if (!isFinite(SCALE) || SCALE <= 0) SCALE = 1;
  EYE_HEIGHT = CFG.eyeHeight;
  PLAYER_RADIUS = 0.35 * SCALE; WALK_SPEED = 3.2 * SCALE; RUN_SPEED = 6.0 * SCALE;
  MAX_STEP_UP = 0.5 * SCALE; RAY_LOOKAHEAD = 0.05 * SCALE;
  camera.far = Math.max(1000, diagonal * 10);
  camera.near = Math.max(0.001, diagonal * 0.0001);
  camera.updateProjectionMatrix();

  const startY = modelBox.max.y > modelBox.min.y ? modelBox.min.y + EYE_HEIGHT : center.y;
  camera.position.set(center.x, startY, center.z);
  camera.rotation.set(0, BASE_YAW, 0);
  buildAtmosphere(center, size);
  buildSunlight(glassMeshes, center, size);
  setupBVH(collidableMeshes);

  modelReady = true;
  applyRecords();
  setProgress(1, 'Prêt');
  $('loadbox').classList.add('done');
  intro.classList.add('ready');
  enterBtn.classList.add('show');
  animate();
}
const BASE_YAW = -Math.PI / 2;   // regarde vers +X au départ (comme avant)

(async function loadAll() {
  try {
    const buf = await downloadModel();
    setProgress(0.88, 'Construction de la salle');
    await new Promise((r) => setTimeout(r, 30));            // laisse le navigateur afficher la barre
    gltfLoader.parse(buf, '', (gltf) => { try { onModelBuilt(gltf); } catch (e) { fail(e); } }, fail);
  } catch (e) { fail(e); }
})();
function fail(err) {
  console.error(err);
  $('load-label').textContent = 'Erreur de chargement du modèle 3D';
  $('load-label').style.color = '#ff6b6b';
}

/* ------------------------------------------------------------------ */
/*  Boucle principale                                                   */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3(), mdir = new THREE.Vector3();
let frameNo = 0, slowTime = 0, perfStage = 0, fovAnim = false;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  frameNo++;

  if (!entered) {
    camera.rotation.y = BASE_YAW + Math.sin(t * 0.22) * 0.55;
    camera.rotation.x = Math.sin(t * 0.15) * 0.05;
  } else if (controls.isLocked || touchEnabled) {
    updateMovement(dt);
  }
  applyTouchLook();

  if (camera.fov > baseFov() + 0.01) {                                   // petit "warp" à l'entrée
    const bf = baseFov(); camera.fov += (bf - camera.fov) * Math.min(1, dt * 3.2);
    if (camera.fov < bf + 0.05) camera.fov = bf;
    camera.updateProjectionMatrix();
  }

  processUploads();
  for (let i = fades.length - 1; i >= 0; i--) {
    fades[i].value = Math.min(1, fades[i].value + dt / 0.7);
    if (fades[i].value >= 1) fades.splice(i, 1);
  }
  updateHover(dt);

  if (dustMat) { dustMat.uniforms.uTime.value = t; dustMat.uniforms.uCam.value.copy(camera.position); }
  updateLights(dt, t);

  if (composer) {
    fxPass.uniforms.uTime.value = t % 100;
    composer.render();
  } else renderer.render(scene, camera);

  // si le PC rame : on retire d'abord le halo, puis tout le post-traitement
  if (composer && frameNo > 120) {
    slowTime = dt > 0.034 ? slowTime + dt : Math.max(0, slowTime - dt);
    if (slowTime > 2.5) {
      slowTime = 0; perfStage++;
      if (perfStage === 1 && bloom) bloom.enabled = false;
      else { composer = null; renderer.setPixelRatio(1); renderer.setSize(window.innerWidth, window.innerHeight); }
    }
  }
}

function updateMovement(delta) {
  const speed = move.run ? RUN_SPEED : WALK_SPEED, step = speed * delta;
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  rgt.crossVectors(fwd, camera.up).normalize();
  mdir.set(0, 0, 0);
  if (move.forward) mdir.add(fwd);
  if (move.back) mdir.sub(fwd);
  if (move.right) mdir.add(rgt);
  if (move.left) mdir.sub(rgt);
  const pos = camera.position;
  let moving = false;

  if (mdir.lengthSq() > 0) {
    isAutoMoving = false; moving = true;
    mdir.normalize();
    const tx = new THREE.Vector3(mdir.x, 0, 0), tz = new THREE.Vector3(0, 0, mdir.z);
    if (mdir.x !== 0 && !isBlocked(pos, tx, step)) pos.x += mdir.x * step;
    if (mdir.z !== 0 && !isBlocked(pos, tz, step)) pos.z += mdir.z * step;
  } else if (isAutoMoving && moveTarget) {
    const dx = moveTarget.x - pos.x, dz = moveTarget.z - pos.z, dist = Math.hypot(dx, dz);
    if (dist < AUTO_ARRIVE * SCALE) isAutoMoving = false;
    else {
      moving = true;
      const ux = dx / dist, uz = dz / dist, auto = Math.min(WALK_SPEED * delta, dist);
      let mx = false, mz = false;
      if (!isBlocked(pos, new THREE.Vector3(ux, 0, 0), auto)) { pos.x += ux * auto; mx = true; }
      if (!isBlocked(pos, new THREE.Vector3(0, 0, uz), auto)) { pos.z += uz * auto; mz = true; }
      if (!mx && !mz) isAutoMoving = false;
      // la caméra se tourne doucement vers la direction de marche
      const targetYaw = Math.atan2(-ux, -uz);
      let diff = targetYaw - camera.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      camera.rotation.y += diff * Math.min(1, 6 * delta);
    }
  }

  if (!moving && frameNo % 12 !== 0) return;                 // immobile : on économise les raycasts

  const floorY = raycastFloorYRobust(pos.x, pos.y + EYE_HEIGHT, pos.z);
  if (floorY !== null) {
    const targetY = floorY + EYE_HEIGHT, diff = targetY - pos.y;
    if (Math.abs(diff) < MAX_STEP_UP + EYE_HEIGHT) pos.y += diff * Math.min(1, GROUND_SNAP_SPEED * delta);
    else if (diff < 0) pos.y += Math.max(diff, -WALK_SPEED * delta * 2);
  } else {
    raycaster.set(new THREE.Vector3(pos.x, pos.y - EYE_HEIGHT - (0.05 * SCALE), pos.z), new THREE.Vector3(0, 1, 0));
    raycaster.far = MAX_STEP_UP + (0.3 * SCALE);
    const up = raycaster.intersectObjects(collidableMeshes, false);
    if (up.length > 0) pos.y = up[0].point.y + EYE_HEIGHT;
  }
  const ceil = raycastCeilingDist(pos);
  if (ceil < EYE_HEIGHT) pos.y -= (EYE_HEIGHT - ceil);
}

function onResize() {
  const vv = window.visualViewport;
  const w = Math.round(vv ? vv.width : window.innerWidth), h = Math.round(vv ? vv.height : window.innerHeight);
  if (!w || !h) return;
  camera.aspect = w / h;
  if (camera.fov <= baseFov() + 0.05) camera.fov = baseFov();   // pas pendant l'effet d'entrée
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  document.documentElement.style.setProperty('--vh', h + 'px');
}
let resizeTimer = null;
const scheduleResize = () => { onResize(); clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 250); };
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);
onResize();

/* ------------------------------------------------------------------ */
/*  Contact                                                             */
/* ------------------------------------------------------------------ */
const cModal = $('contact-modal'), cErr = $('c-error'), cStatus = $('c-status'), cSend = $('c-send');
const cName = $('c-name'), cEmail = $('c-email'), cMsg = $('c-message');
function openContact() {
  contactOpen = true;
  if (controls.isLocked) controls.unlock();
  Object.keys(move).forEach((k) => { move[k] = false; });
  cErr.style.display = 'none'; cStatus.style.display = 'none'; cModal.style.display = 'flex';
}
function closeContact() {
  contactOpen = false; cModal.style.display = 'none';
  if (entered && !isTouch && !controls.isLocked) showPause();
}
$('contact-btn').addEventListener('click', openContact);
$('c-cancel').addEventListener('click', closeContact);
cModal.addEventListener('click', (e) => { if (e.target === cModal) closeContact(); });
function showStatus(text, ok) { cStatus.textContent = text; cStatus.style.color = ok ? '#7be495' : '#ff8686'; cStatus.style.display = 'block'; }
const E = CFG.emailjs;
const emailJsConfigured = () => E.service.indexOf('VOTRE_') !== 0 && E.template.indexOf('VOTRE_') !== 0 && E.publicKey.indexOf('VOTRE_') !== 0;
function sendWithMailto(name, email, message) {
  const subject = encodeURIComponent('Message depuis la galerie virtuelle - ' + name);
  const body = encodeURIComponent('Nom : ' + name + '\nEmail : ' + email + '\n\n' + message);
  window.location.href = 'mailto:' + CFG.contactEmail + '?subject=' + subject + '&body=' + body;
}
cSend.addEventListener('click', () => {
  const name = cName.value.trim(), email = cEmail.value.trim(), message = cMsg.value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  cStatus.style.display = 'none';
  if (!name || !emailOk || !message) { cErr.style.display = 'block'; return; }
  cErr.style.display = 'none';
  if (!emailJsConfigured()) {
    sendWithMailto(name, email, message);
    cName.value = cEmail.value = cMsg.value = '';
    closeContact();
    return;
  }
  cSend.disabled = true; cSend.textContent = 'Envoi…';
  fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ service_id: E.service, template_id: E.template, user_id: E.publicKey,
      template_params: { from_name: name, from_email: email, reply_to: email, message } })
  }).then((res) => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    cName.value = cEmail.value = cMsg.value = '';
    showStatus('Merci ! Ton message a bien été envoyé.', true);
    setTimeout(closeContact, 2000);
  }).catch((err) => { console.error('EmailJS', err); showStatus("L'envoi a échoué. Réessaie dans un instant.", false); })
    .then(() => { cSend.disabled = false; cSend.textContent = 'Envoyer'; });
});
</script>
